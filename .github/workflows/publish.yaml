name: publish

# The Souschef fork must not publish to the public recipe-scrapers PyPI
# project. publish runs only when the PUBLISH_TO_PYPI repository variable
# is the string true.
on:
  release:
    types: [published]

jobs:
  publish:
    if: vars.PUBLISH_TO_PYPI == 'true'
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/recipe-scrapers
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build the package
        run: |
          python -m pip install --upgrade build
          python -m build .
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
      - name: Show build version used
        run: pip list | grep build
