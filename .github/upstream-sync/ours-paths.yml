# Paths owned by the Souschef fork.
# fork_only: keep our version when upstream changes the same path.
# dual_owned: 3-way merge. Never take ours or theirs for the whole file.
# recipe_scrapers/__init__.py is dual-owned and then unioned by upstream_sync.py.

fork_only:
  - recipe_scrapers/_utils_jp.py
  - recipe_scrapers/_site_recipe_fallback.py
